<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature comparator</title>
<style>
  :root{
    --bg:#000000; --fg:#f2f2f2; --muted:#9a9a9a; --line:#2e2e2e;
    --panel:#0c0c0c; --red:#e0342c; --redsoft:#8f2019;
    --f:#f2f2f2; --g:#f2f2f2; --ok:#3ddc84; --no:#ff5c5c; --sel:#ffcc00;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:26px;background:var(--bg);color:var(--fg);
       font:17px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1{font-size:25px;margin:0 0 4px;letter-spacing:.01em}
  h1::after{content:"";display:block;width:74px;height:4px;background:var(--red);
            margin-top:8px;border-radius:2px}
  .sub{color:var(--muted);font-size:15px;margin:12px 0 20px}
  .bar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;
       padding:14px 16px;background:var(--panel);border:1px solid var(--line);
       border-left:5px solid var(--red);border-radius:8px;margin-bottom:22px}
  label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:3px}
  input[type=number],input[type=text]{background:#ffffff;color:#000000;
       border:2px solid var(--red);border-radius:5px;padding:6px 8px;font:inherit}
  input:focus{outline:2px solid var(--sel);outline-offset:1px}
  button{background:var(--red);color:#fff;border:2px solid var(--red);
         border-radius:6px;padding:9px 18px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:2px solid var(--red);
               font-weight:400;padding:7px 13px}
  button.ghost:hover{background:var(--red);color:#fff}
  button:hover{opacity:.88}
  .cols{display:grid;grid-template-columns:1fr;gap:22px}
  .panel{border:1px solid var(--line);border-left:5px solid var(--red);
         border-radius:8px;padding:18px;background:var(--panel)}
  .panel h2{margin:0 0 14px;font-size:20px;color:var(--fg)}
  .panel h2 b{color:var(--red)}
  .mode{font-size:14px;color:var(--muted);margin:20px 0 8px;
        text-transform:uppercase;letter-spacing:.07em;
        border-bottom:2px solid var(--redsoft);padding-bottom:5px}
  table{border-collapse:collapse}
  td.hdr,th{font-size:13px;color:var(--muted);font-weight:400;padding:2px 4px;text-align:center}
  td input{width:80px;text-align:right;padding:5px 7px;
           font:15px ui-monospace,SFMono-Regular,Menlo,monospace}
  ::placeholder{color:#888}
  select{background:#ffffff;color:#000000;border:2px solid var(--red);
         border-radius:5px;padding:6px 8px;font:inherit}
  input[type=file]{background:#ffffff;color:#000000;border:2px solid var(--red);
         border-radius:5px;padding:6px 8px;font:14px inherit;max-width:100%}
  input[type=file]::file-selector-button{background:var(--red);color:#fff;border:0;
         border-radius:4px;padding:4px 10px;margin-right:8px;font:inherit;cursor:pointer}
  #meta{border:1px solid var(--line);border-left:5px solid var(--red);border-radius:8px;
        padding:14px 16px;margin-bottom:22px;background:var(--panel);display:none}
  #meta h3{margin:0 0 8px;font-size:18px;color:#ffffff}
  #meta .kv{display:grid;grid-template-columns:170px 1fr;gap:6px 16px;font-size:15.5px}
  #meta .k{color:var(--muted)}
  #meta .v{color:#ffffff}
  #meta code{font:14px ui-monospace,Menlo,monospace;color:#ffcc00}
  body.drag{outline:4px dashed var(--red);outline-offset:-8px}
  #modal{position:fixed;inset:0;background:#000;z-index:99;display:none;
         flex-direction:column;padding:10px 14px 14px}
  #modal.on{display:flex}
  #modal .top{display:flex;align-items:center;gap:16px;flex:0 0 auto;padding-bottom:6px}
  #modal .top h2{margin:0;font-size:20px}
  #modal .pair{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;
               gap:14px;min-height:0}
  #modal .half{display:flex;flex-direction:column;min-height:0;
               border:1px solid var(--line);border-left:5px solid var(--red);
               border-radius:8px;padding:8px}
  #modal .half b{flex:0 0 auto;text-align:center;font-size:26px;color:var(--red);
                 padding-bottom:4px}
  #modal .half .box{flex:1 1 auto;min-height:0;display:flex;
                    align-items:center;justify-content:center}
  #modal svg{width:100%;height:100%;max-width:100%;max-height:100%}
  @media (max-width:820px){#modal .pair{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  textarea{width:100%;min-height:170px;background:#ffffff;color:#000000;
           border:2px solid var(--red);border-radius:5px;padding:10px;
           font:15.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
  textarea:focus{outline:2px solid var(--sel);outline-offset:1px}
  svg{display:block;margin:6px auto;touch-action:manipulation}
  svg path{cursor:pointer}
  .selrow{display:flex;gap:10px;align-items:flex-end;margin-top:10px;flex-wrap:wrap}
  .err{color:var(--no);font-size:14px;min-height:17px;margin-top:5px}
  .out{margin-top:24px}
  .block{border:1px solid var(--line);border-left:5px solid var(--red);
         border-radius:8px;padding:14px 16px;margin-bottom:14px;
         background:var(--panel);overflow-x:auto}
  .block h3{margin:0 0 10px;font-size:16.5px;color:#ffffff}
  pre{margin:0;color:#ffffff;font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;
      white-space:pre;overflow-x:auto}
  .tag{float:right;font-size:13.5px;font-weight:600;padding:1px 10px;border-radius:99px}
  .tag.y{color:var(--ok);border:1px solid var(--ok)}
  .tag.n{color:var(--no);border:1px solid var(--no)}
  .verdict{font-size:36px;font-weight:700;text-align:center;padding:20px;
           border-radius:8px;border:2px solid;letter-spacing:.04em}
  .verdict.y{color:var(--ok);border-color:var(--ok)}
  .verdict.n{color:var(--no);border-color:var(--no)}
  .verdict small{display:block;font-size:15px;font-weight:400;color:var(--muted);
                 margin-top:8px;letter-spacing:0}
</style>
</head>
<body>

<h1>Signature comparator</h1>
<div class="sub">Two objects on a polar grid of <b>N</b> wedges by <b>K</b> rings.
Enter each one three ways: the matrix, the polar grid, or a Python list. The three stay in sync.</div>

<div class="bar">
  <div><label>rings K</label><input type="number" id="K" min="1" max="24" value="2" style="width:76px"></div>
  <div><label>wedges N</label><input type="number" id="N" min="2" max="40" value="9" style="width:76px"></div>
  <button class="ghost" id="resize">resize grid</button>
  <button class="ghost" id="clear">clear</button>
  <button class="ghost" id="nums">hide numbers</button>
  <button class="ghost" id="big">big view</button>
  <div><label>example</label>
    <select id="ex" style="max-width:340px"></select></div>
  <div><label>load another json</label>
    <input type="file" id="jsonfile" accept=".json,application/json" style="max-width:230px"></div>
  <div style="flex:1"></div>
  <button id="go">compute signatures</button>
</div>

<div id="modal">
  <div class="top">
    <h2>polar grids, side by side</h2>
    <button class="ghost" id="bignums">hide numbers</button>
    <div style="flex:1"></div>
    <button id="bigclose">close</button>
  </div>
  <div class="pair">
    <div class="half"><b>f</b><div class="box" id="big-f"></div></div>
    <div class="half"><b>g</b><div class="box" id="big-g"></div></div>
  </div>
</div>

<div id="meta"></div>

<div class="cols">
  <div class="panel f" id="panel-f"></div>
  <div class="panel g" id="panel-g"></div>
</div>

<div class="out" id="out"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ state */
let K = 2, N = 9, showNums = true;
const DEMO = {
  f: [[448, 367, -20, -11, -677, 565, -371, 52, -353],
      [112, -176, -311, 571, -590, 562, 481, -293, -356]],
  g: [[-448, 479, 92, 101, -565, 677, -259, 164, -241],
      [-112, -148, -283, 599, -562, 590, 509, -265, -328]]
};
const data = { f: null, g: null };
const sel  = { f: {k:0, n:0}, g: {k:0, n:0} };

function blank(K, N){ return Array.from({length:K}, () => Array(N).fill(0)); }

function resizeInto(old, K, N){
  const out = blank(K, N);
  if (old) for (let k = 0; k < Math.min(K, old.length); k++)
    for (let n = 0; n < Math.min(N, old[k].length); n++) out[k][n] = old[k][n];
  return out;
}

/* -------------------------------------------------------------- signature */
/* Exactly the definition used in the counterexample record:
   - for each lag l = 1..floor(N/2): the SORTED multiset of the N squared
     wedge distances  sum_k ( A[k][n] - A[k][(n+l) mod N] )^2
   - every row sum
   - every row sum of squares                                              */
function allInt(A){ return A.every(r => r.every(x => Number.isInteger(x))); }

/* Squared wedge distances reach 1e30 on the larger examples, well past the
   9e15 where float64 stops being exact, so integer objects are summed with
   BigInt and compared exactly. Non-integer objects fall back to float. */
function signature(A){
  const K = A.length, N = A[0].length, exact = allInt(A);
  const B = exact ? A.map(r => r.map(x => BigInt(x))) : A;
  const Z = exact ? 0n : 0;
  const lags = [];
  for (let l = 1; l <= Math.floor(N/2); l++){
    const d = [];
    for (let n = 0; n < N; n++){
      let s = Z;
      for (let k = 0; k < K; k++){
        const t = B[k][n] - B[k][(n + l) % N];
        s += t * t;
      }
      d.push(s);
    }
    d.sort((a,b) => (a < b ? -1 : a > b ? 1 : 0));
    lags.push(d);
  }
  const rowSum = B.map(r => r.reduce((a,b) => a + b, Z));
  const rowSq  = B.map(r => r.reduce((a,b) => a + b*b, Z));
  return { lags, rowSum, rowSq, exact };
}

const TOL = 1e-9;
function near(a, b){
  if (typeof a === "bigint" || typeof b === "bigint") return a === b;
  return Math.abs(a - b) <= TOL * Math.max(1, Math.abs(a), Math.abs(b));
}
function vecEq(u, v){ return u.length === v.length && u.every((x,i) => near(x, v[i])); }
function lagsEq(u, v){ return u.length === v.length && u.every((x,i) => vecEq(x, v[i])); }

/* ----------------------------------------------------------------- format */
function fmt(x){
  if (typeof x === "bigint") return x.toString();
  if (Number.isInteger(x)) return String(x);
  const r = Math.round(x);
  if (Math.abs(x - r) < 1e-9) return String(r);
  return (+x.toFixed(6)).toString();
}
function fmtVec(v){ return "(" + v.map(fmt).join(", ") + ")"; }

/* ----------------------------------------------------- matrix input (grid) */
function matrixHTML(w){
  let h = "<table><tr><td class='hdr'></td>";
  for (let n = 0; n < N; n++) h += `<td class='hdr'>w${n+1}</td>`;
  h += "</tr>";
  for (let k = 0; k < K; k++){
    h += `<tr><td class='hdr'>ring&nbsp;${k+1}</td>`;
    for (let n = 0; n < N; n++)
      h += `<td><input type="text" inputmode="decimal" data-w="${w}" data-k="${k}" data-n="${n}"
             value="${fmt(data[w][k][n])}"></td>`;
    h += "</tr>";
  }
  return h + "</table>";
}

/* ------------------------------------------------------- polar input (svg) */
function ramp(t){
  const stops = [[255,255,229],[199,233,180],[65,182,196],[34,94,168],[8,29,88]];
  if (!isFinite(t)) t = 0;                       // never index the ramp with NaN
  t = Math.max(0, Math.min(1, t)) * (stops.length - 1);
  const i = Math.min(Math.floor(t), stops.length - 2), u = t - i;
  const c = stops[i].map((v, j) => Math.round(v + u * (stops[i+1][j] - v)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* the fill ramp runs light to dark, so the label flips to white on the dark end */
function ink(t){ return t > 0.55 ? "#ffffff" : "#0a0a0a"; }

function sectorPath(cx, cy, r0, r1, a0, a1){
  const S = 22, pts = [];
  for (let i = 0; i <= S; i++){ const a = a0 + (a1 - a0) * i / S;
    pts.push([cx + r1*Math.cos(a), cy - r1*Math.sin(a)]); }
  for (let i = S; i >= 0; i--){ const a = a0 + (a1 - a0) * i / S;
    pts.push([cx + r0*Math.cos(a), cy - r0*Math.sin(a)]); }
  return "M " + pts.map(p => p[0].toFixed(2) + " " + p[1].toFixed(2)).join(" L ") + " Z";
}

function polarHTML(w, fill){
  const A = data[w], S = 520, cx = S/2, cy = S/2, R = S/2 - 34;
  const flat = A.flat();
  const lo = Math.min(...flat), hi = Math.max(...flat);
  let s = fill ? `<svg viewBox="0 0 ${S} ${S}" preserveAspectRatio="xMidYMid meet">`
              : `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}">`;
  for (let k = 0; k < K; k++){
    const r0 = R * k / K, r1 = R * (k+1) / K;
    for (let n = 0; n < N; n++){
      const a0 = 2*Math.PI * n / N, a1 = 2*Math.PI * (n+1) / N;
      const t = hi === lo ? .5 : (A[k][n] - lo) / (hi - lo);
      const on = sel[w].k === k && sel[w].n === n;
      s += `<path d="${sectorPath(cx, cy, r0, r1, a0, a1)}" fill="${ramp(t)}"
             stroke="${on ? "#ffcc00" : "#3a3a3a"}" stroke-width="${on ? 4 : 1.2}"
             data-w="${w}" data-k="${k}" data-n="${n}"></path>`;
      if (!showNums) continue;
      const am = (a0 + a1) / 2, rm = (r0 + r1) / 2 + (k === 0 ? R/(K*5) : 0);
      s += `<text x="${(cx + rm*Math.cos(am)).toFixed(1)}"
                  y="${(cy - rm*Math.sin(am) + 4).toFixed(1)}" text-anchor="middle"
              font-size="${K*N > 120 ? 11 : K*N > 60 ? 14 : K*N > 24 ? 17 : 21}" fill="${ink(t)}"
              style="pointer-events:none;font-family:ui-monospace,Menlo,monospace"
             >${fmt(A[k][n])}</text>`;
    }
  }
  for (let n = 0; n < N; n++){
    const am = 2*Math.PI * (n + .5) / N, rr = R + 13;
    s += `<text x="${(cx + rr*Math.cos(am)).toFixed(1)}"
                y="${(cy - rr*Math.sin(am) + 4).toFixed(1)}" text-anchor="middle"
            font-size="15" fill="#9a9a9a" style="pointer-events:none">${n+1}</text>`;
  }
  return s + "</svg>";
}

/* ------------------------------------------------------ python list parser */
function parsePy(text){
  let s = text.trim();
  if (!s) throw new Error("empty");
  s = s.replace(/np\.array\s*\(/g, "(").replace(/\barray\s*\(/g, "(");
  const i = s.indexOf("["), j = s.lastIndexOf("]");
  if (i < 0 || j < 0 || j < i) throw new Error("no [ ... ] found");
  s = s.slice(i, j + 1).replace(/\s+/g, " ").replace(/,\s*([\]\)])/g, "$1");
  let v;
  try { v = JSON.parse(s); } catch(e){ throw new Error("not a valid list"); }
  if (!Array.isArray(v) || v.length === 0) throw new Error("not a list");
  if (!Array.isArray(v[0])) v = [v];                       // a single row is fine
  const cols = v[0].length;
  if (cols === 0) throw new Error("a row is empty");
  for (const row of v){
    if (!Array.isArray(row) || row.length !== cols) throw new Error("rows differ in length");
    for (const x of row) if (typeof x !== "number" || !isFinite(x))
      throw new Error("a value is not a finite number");
  }
  return v;
}
function toPy(A){ return "[" + A.map(r => "[" + r.map(fmt).join(", ") + "]").join(",\n "); }

/* -------------------------------------------------------------- rendering */
function panelHTML(w){
  const name = w === "f" ? "f" : "g";
  return `<h2>object <b>${name}</b></h2>
    <div class="mode">1. matrix</div>
    <div style="overflow-x:auto">${matrixHTML(w)}</div>
    <div class="mode">2. polar grid, click a cell then type</div>
    ${polarHTML(w)}
    <div class="selrow">
      <div><label>ring ${sel[w].k+1}, wedge ${sel[w].n+1}</label>
        <input type="text" inputmode="decimal" id="selin-${w}"
               value="${fmt(data[w][sel[w].k][sel[w].n])}" style="width:110px"></div>
      <span style="color:var(--muted);font-size:12px">arrow keys move the selection</span>
    </div>
    <div class="mode">3. python list</div>
    <textarea id="py-${w}" spellcheck="false">${toPy(data[w])}</textarea>
    <div class="err" id="err-${w}"></div>`;
}

function render(){
  document.getElementById("K").value = K;
  document.getElementById("N").value = N;
  for (const w of ["f","g"]){
    document.getElementById("panel-" + w).innerHTML = panelHTML(w);
    wire(w);
  }
}

function setCell(w, k, n, val){
  if (!isFinite(val)) return;
  data[w][k][n] = val;
  refresh(w);
}

/* redraw one panel without losing focus on the field being typed in */
function refresh(w, skip){
  const p = document.getElementById("panel-" + w);
  const active = document.activeElement;
  const id = active && active.id ? active.id : null;
  const pos = active && active.selectionStart;
  p.innerHTML = panelHTML(w);
  wire(w);
  if (id && document.getElementById(id)){
    const el = document.getElementById(id);
    el.focus();
    try { el.setSelectionRange(pos, pos); } catch(e){}
  }
}

function wire(w){
  const p = document.getElementById("panel-" + w);

  p.querySelectorAll("table input").forEach(el => {
    el.addEventListener("focus", () => {
      sel[w] = { k:+el.dataset.k, n:+el.dataset.n };
    });
    el.addEventListener("change", () => {
      const v = parseFloat(el.value);
      if (isFinite(v)) setCell(w, +el.dataset.k, +el.dataset.n, v);
      else refresh(w);
    });
  });

  p.querySelectorAll("svg path").forEach(el => {
    el.addEventListener("click", () => {
      sel[w] = { k:+el.dataset.k, n:+el.dataset.n };
      refresh(w);
      const inp = document.getElementById("selin-" + w);
      if (inp){ inp.focus(); inp.select(); }
    });
  });

  const si = document.getElementById("selin-" + w);
  if (si){
    si.addEventListener("change", () => {
      const v = parseFloat(si.value);
      if (isFinite(v)) setCell(w, sel[w].k, sel[w].n, v);
    });
    si.addEventListener("keydown", ev => {
      const m = {ArrowRight:[0,1], ArrowLeft:[0,-1], ArrowDown:[1,0], ArrowUp:[-1,0]}[ev.key];
      if (ev.key === "Enter"){ si.dispatchEvent(new Event("change")); ev.preventDefault(); return; }
      if (!m) return;
      ev.preventDefault();
      const v = parseFloat(si.value);
      if (isFinite(v)) data[w][sel[w].k][sel[w].n] = v;
      sel[w] = { k: (sel[w].k + m[0] + K) % K, n: (sel[w].n + m[1] + N) % N };
      refresh(w);
      const nx = document.getElementById("selin-" + w);
      if (nx){ nx.focus(); nx.select(); }
    });
  }

  const ta = document.getElementById("py-" + w), er = document.getElementById("err-" + w);
  if (ta) ta.addEventListener("change", () => {
    try {
      const A = parsePy(ta.value);
      er.textContent = "";
      if (A.length !== K || A[0].length !== N){
        K = A.length; N = A[0].length;
        for (const x of ["f","g"]){
          data[x] = resizeInto(data[x], K, N);
          sel[x] = { k:0, n:0 };
        }
        data[w] = A;
        render();
        return;
      }
      data[w] = A;
      refresh(w);
    } catch(e){ er.textContent = "could not read that list: " + e.message; }
  });
}

/* --------------------------------------------- how are f and g related? */
function rollRow(r, s){ const N = r.length; return r.map((_,i) => r[((i - s) % N + N) % N]); }
function reflectRow(r){ const m = r.reduce((a,b) => a + b, 0) / r.length;
                        return r.map(x => 2*m - x); }
function rowEqv(u, v){ return u.length === v.length && u.every((x,i) => near(x, v[i])); }

/* every (shift, reflected) carrying one row onto another */
function rowOps(src, tgt){
  const N = src.length, out = [];
  for (const refl of [false, true]){
    const base = refl ? reflectRow(src) : src;
    for (let s = 0; s < N; s++) if (rowEqv(rollRow(base, s), tgt)) out.push({s, refl});
  }
  return out;
}

function relations(f, g){
  const K = f.length;
  const res = {rotation:null, reversal:null, reflection:null, perRow:null, group:null};
  for (const rev of [false, true]){
    const src = f.map(r => rev ? r.slice().reverse() : r.slice());
    const per = src.map((r,k) => rowOps(r, g[k]));
    if (per.some(o => o.length === 0)) continue;

    const plain = per.map(o => o.filter(x => !x.refl).map(x => x.s));
    if (plain.every(a => a.length)){
      const common = plain[0].filter(s => plain.every(a => a.includes(s)));
      if (common.length){
        if (!rev && res.rotation === null) res.rotation = {shift: common[0]};
        if ( rev && res.reversal === null) res.reversal = {shift: common[0]};
      }
    }
    const any = per.map(o => o.map(x => x.s));
    const common2 = any[0].filter(s => any.every(a => a.includes(s)));
    if (common2.length && res.reflection === null){
      const s = common2[0];
      const which = per.map(o => o.find(x => x.s === s).refl);
      if (which.some(Boolean)) res.reflection = {shift:s, rows:which, reversed:rev};
    }
    if (plain.every(a => a.length) && res.perRow === null){
      const shifts = plain.map(a => a[0]);
      if (new Set(shifts).size > 1) res.perRow = {shifts, reversed:rev};
    }
    if (res.group === null) res.group = {reversed:rev, ops: per.map(o => o[0])};
  }
  return res;
}

function relationLines(f, g){
  const R = relations(f, g);
  const yes = s => `  YES   ${s}`, no = s => `  no    ${s}`;
  const L = [];
  L.push(R.rotation
    ? yes(`global rotation, every row shifted by ${R.rotation.shift}`)
    : no("global rotation"));
  L.push(R.reversal
    ? yes(`global reversal, then every row shifted by ${R.reversal.shift}`)
    : no("global reversal"));
  L.push(R.reflection
    ? yes(`reflection of row${R.reflection.rows.filter(Boolean).length > 1 ? "s" : ""} `
        + R.reflection.rows.map((b,i) => b ? i+1 : null).filter(x => x).join(", ")
        + ` about twice ${R.reflection.rows.filter(Boolean).length > 1 ? "their" : "its"} own mean`
        + (R.reflection.shift ? `, then shift ${R.reflection.shift}` : "")
        + (R.reflection.reversed ? ", after a reversal" : ""))
    : no("reflection of any rows about twice their own mean"));
  L.push(R.perRow
    ? yes(`each row rotated on its own, shifts (${R.perRow.shifts.join(", ")})`
        + (R.perRow.reversed ? ", after a reversal" : ""))
    : no("independent rotation of each row"));
  L.push("");
  L.push(R.group
    ? "  the two are related by a composition of the operations above"
    : "  NONE of these relates f to g");
  return L.join("\n");
}

/* ------------------------------------------------------------- the output */
function block(title, body, agree){
  const tag = agree === null ? ""
    : `<span class="tag ${agree ? "y" : "n"}">${agree ? "same" : "different"}</span>`;
  return `<div class="block"><h3>${title}${tag}</h3><pre>${body}</pre></div>`;
}

function compute(){
  const sf = signature(data.f), sg = signature(data.g);

  let b1 = "";
  for (let i = 0; i < sf.lags.length; i++){
    const ok = vecEq(sf.lags[i], sg.lags[i]);
    b1 += `lag ${String(i+1).padStart(2)}   f  ${fmtVec(sf.lags[i])}\n`
       +  `         g  ${fmtVec(sg.lags[i])}   ${ok ? "same" : "DIFFERENT"}\n`;
  }
  const a1 = lagsEq(sf.lags, sg.lags);

  const a2 = vecEq(sf.rowSum, sg.rowSum);
  const b2 = `f  ${fmtVec(sf.rowSum)}\ng  ${fmtVec(sg.rowSum)}`;

  const a3 = vecEq(sf.rowSq, sg.rowSq);
  const b3 = `f  ${fmtVec(sf.rowSq)}\ng  ${fmtVec(sg.rowSq)}`;

  const all = a1 && a2 && a3;
  const identical = data.f.every((r,k) => r.every((x,n) => near(x, data.g[k][n])));

  const b4 = relationLines(data.f, data.g);
  const a4 = relations(data.f, data.g).group !== null;

  document.getElementById("out").innerHTML =
      block(`block 1 &nbsp;sorted squared wedge distances, lags 1 to ${Math.floor(N/2)}`, b1, a1)
    + block("block 2 &nbsp;row sums", b2, a2)
    + block("block 3 &nbsp;row sums of squares", b3, a3)
    + block("block 4 &nbsp;is g an allowed transformation of f?", b4, a4)
    + `<div class="verdict ${all ? "y" : "n"}">${all ? "TRUE" : "FALSE"}
         <small>${all
           ? (identical
              ? "the signatures agree, but f and g are the same matrix"
              : (a4 ? "the signatures agree, and g is an allowed transformation of f"
                    : "the signatures agree, and NO allowed transformation relates them, so this is a counterexample"))
           : "the signatures differ"}</small></div>`;
}

/* --------------------------------------------------------------- controls */
document.getElementById("resize").onclick = () => {
  const k = Math.max(1, Math.min(24, +document.getElementById("K").value || 1));
  const n = Math.max(2, Math.min(40, +document.getElementById("N").value || 2));
  K = k; N = n;
  for (const w of ["f","g"]){ data[w] = resizeInto(data[w], K, N); sel[w] = {k:0, n:0}; }
  render();
};
document.getElementById("clear").onclick = () => {
  for (const w of ["f","g"]){ data[w] = blank(K, N); sel[w] = {k:0, n:0}; }
  render();
  document.getElementById("out").innerHTML = "";
};
const demoBtn = document.getElementById("demo");
if (demoBtn) demoBtn.onclick = () => {
  K = DEMO.f.length; N = DEMO.f[0].length;
  data.f = DEMO.f.map(r => r.slice());
  data.g = DEMO.g.map(r => r.slice());
  for (const w of ["f","g"]) sel[w] = {k:0, n:0};
  render();
};
/* ------------------------------------------------- examples from the json */
let EXAMPLES = [];

function loadExampleSet(obj){
  const list = Array.isArray(obj) ? obj : (obj.counterexamples || obj.examples || []);
  EXAMPLES = list;
  const sel = document.getElementById("ex");
  sel.innerHTML = '<option value="-1">none, edit by hand</option>';
  list.forEach((c, i) => {
    const usable = Array.isArray(c.f) && Array.isArray(c.g);
    const o = document.createElement("option");
    o.value = i;
    o.textContent = (c.id || ("example " + (i+1)))
      + (c.K && c.N ? `  (K=${c.K}, N=${c.N})` : "")
      + (usable ? "" : "  [matrices not in this file]");
    o.disabled = !usable;
    sel.appendChild(o);
  });
  const first = list.findIndex(c => Array.isArray(c.f) && Array.isArray(c.g));
  if (first >= 0){ sel.value = first; applyExample(first); }
}

function applyExample(i){
  const c = EXAMPLES[i];
  if (!c || !Array.isArray(c.f) || !Array.isArray(c.g)) return;
  K = c.f.length; N = c.f[0].length;
  data.f = c.f.map(r => r.slice());
  data.g = c.g.map(r => r.slice());
  for (const w of ["f","g"]) sel[w] = {k:0, n:0};
  render();
  showMeta(c);
  document.getElementById("out").innerHTML = "";
}

function showMeta(c){
  const m = document.getElementById("meta");
  if (!c){ m.style.display = "none"; return; }
  const esc = s => String(s).replace(/[<>&]/g, c =>
      ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
  const li = a => {
    if (!a) return "<div style='color:var(--muted)'>none listed</div>";
    if (Array.isArray(a)) return a.length
      ? a.map(x => "<div>" + esc(x) + "</div>").join("")
      : "<div style='color:var(--muted)'>none listed</div>";
    if (typeof a === "object") return Object.entries(a)
      .map(([k,v]) => `<div><span class="k">${esc(k)}</span> <code>${esc(
          Array.isArray(v) ? "(" + v.join(", ") + ")" : v)}</code></div>`).join("");
    return "<div>" + esc(a) + "</div>";
  };
  m.innerHTML = `<h3>${c.id || "example"}</h3>
    <div class="kv">
      <div class="k">size</div><div class="v">K = ${c.K}, N = ${c.N}</div>
      <div class="k">related by</div><div class="v">${li(c.related_by || c.relation)}</div>
      <div class="k">not related by</div><div class="v">${li(c.not_related_by)}</div>
      <div class="k">parameters</div><div class="v">${li(c.parameters)}</div>
      <div class="k">notes</div><div class="v">${li(c.notes)}</div>
      <div class="k">also known as</div><div class="v">${li(c.aliases)}</div>
    </div>`;
  m.style.display = "block";
}

document.getElementById("ex").onchange = ev => {
  const i = +ev.target.value;
  if (i < 0){ showMeta(null); return; }
  applyExample(i);
};

function readJsonFile(file){
  const r = new FileReader();
  r.onload = () => {
    try { loadExampleSet(JSON.parse(r.result)); }
    catch(e){ alert("could not read that json: " + e.message); }
  };
  r.readAsText(file);
}
document.getElementById("jsonfile").addEventListener("change", ev => {
  if (ev.target.files[0]) readJsonFile(ev.target.files[0]);
});
document.addEventListener("dragover", ev => { ev.preventDefault(); document.body.classList.add("drag"); });
document.addEventListener("dragleave", () => document.body.classList.remove("drag"));
document.addEventListener("drop", ev => {
  ev.preventDefault(); document.body.classList.remove("drag");
  const f = ev.dataTransfer.files[0];
  if (f) readJsonFile(f);
});

function drawBig(){
  document.getElementById("big-f").innerHTML = polarHTML("f", true);
  document.getElementById("big-g").innerHTML = polarHTML("g", true);
  for (const half of ["f","g"])
    document.getElementById("big-" + half).querySelectorAll("path").forEach(el => {
      el.addEventListener("click", () => {
        sel[half] = {k:+el.dataset.k, n:+el.dataset.n};
        refresh(half); drawBig();
      });
    });
}
function bigOpen(on){
  document.getElementById("modal").classList.toggle("on", on);
  if (on) drawBig();
}
document.getElementById("big").onclick = () => bigOpen(true);
document.getElementById("bigclose").onclick = () => bigOpen(false);
document.getElementById("bignums").onclick = ev => {
  showNums = !showNums;
  ev.target.textContent = showNums ? "hide numbers" : "show numbers";
  document.getElementById("nums").textContent = ev.target.textContent;
  for (const w of ["f","g"]) refresh(w);
  drawBig();
};
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") bigOpen(false);
});

document.getElementById("nums").onclick = ev => {
  showNums = !showNums;
  ev.target.textContent = showNums ? "hide numbers" : "show numbers";
  document.getElementById("bignums").textContent = ev.target.textContent;
  for (const w of ["f","g"]) refresh(w);
  drawBig();
};
document.getElementById("go").onclick = compute;

data.f = DEMO.f.map(r => r.slice());
data.g = DEMO.g.map(r => r.slice());
render();
try {
  loadExampleSet(JSON.parse(document.getElementById("examples").textContent));
} catch(e){ console.warn("embedded examples unreadable:", e); }
</script>
